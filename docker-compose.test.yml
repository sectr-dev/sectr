# fake-gcs-server for the GCS ArtifactStore tests (behind the
# `gcs` feature). This is the only container the test suite
# needs — Postgres tests use pgtemp (a throwaway real postgres spawned per
# test process, no docker — see crates/*/src/test_pg.rs):
#
#   docker compose -f docker-compose.test.yml up -d
#   SECTR_TEST_GCS_URL=http://localhost:4443 \
#     cargo test -p sectr-common --features gcs
#
# `fsouza/fake-gcs-server` is the canonical emulator. Memory backend + no volume — tests create their own
# buckets via the JSON API.

services:
  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -backend memory
    ports:
      - "4443:4443"
