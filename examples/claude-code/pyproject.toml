[project]
name = "sectr-example-claude-code"
version = "0.1.0"
description = "Sectr example: support agent on claude-code"
requires-python = ">=3.12"
dependencies = [
    "sectr[claude-code]",
]

[tool.uv.sources]
sectr = { path = "../../sdk-python", editable = true }

[dependency-groups]
dev = ["mypy>=1"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
