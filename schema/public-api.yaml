# This was last checked for drift at commit 185df8e09c033928fa23fb53105ea8e3d99d3f36.
#
# Sectr Public HTTP API — the contract between the Rust control plane
# (sectr-server) and its clients: the dashboard, the CLI, and the Python SDK.
#
# Composed (see schema/README.md "API contract layering"): the
# session-interaction paths come from `sessions-api.yaml`
# — this document layers auth on them; session schemas have exactly one
# definition. The operations the data-plane credentials may call are
# re-declared inline, because OpenAPI path-item $refs can't layer
# per-operation security: each copy is the core's operation plus its
# `security` (and, for POST /sessions, an auth-aware description), its
# schemas still $ref'd from the core, and a conformance test fails any
# other difference. Platform-only core paths (/approvals) stay $refs.
#
# DRAFTED from the dashboard's consumption needs (Phase 1.5 UI is the
# client of record; see dashboard/src/lib/api.ts — one function per path
# below). 
#
# Auth principals, all `Authorization: Bearer` (no cookies: the dashboard
# exchanges its Clerk session for a platform key at POST /auth/clerk):
#   - platform API key (`skp_`: CLI, SDK, dashboard; org-scoped)
#   - invocation key (`ski_`: the app's backend; per-app)
#   - user token (`sks_`: an end user's browser; per-app, per-user)
# The server derives `sessions.origin` ("api" | "playground") from which
# principal created the session — the dashboard gates chat input on it.
openapi: 3.1.0
info:
    title: Sectr API
    version: 0.1.0-draft
    description: >-
        Control plane + invocation API. The journal is the source of truth:
        client "live" views are SSE tails of the journal, never proxies of a
        running runner.
servers:
    - url: https://api.sectr.dev
      description: production
    - url: http://localhost:8080
      description: local dev (sectr-server)

security:
    - platformApiKey: []

paths:
    # ------------------------------------------------- sessions (from core)
    # The session data plane, re-declared inline from the core so it can
    # carry its security: platform keys, invocation keys (scoped to their
    # app) and user tokens (scoped to their user's own sessions) may all
    # call these. GET /approvals stays platform-only, so it stays a $ref.
    /sessions:
        post:
            operationId: createSession
            summary: Create a session and start its first turn
            description: >-
                Dual auth: invocation key (end-user path, origin="api") or platform
                principal (dashboard playground, origin="playground"). Starts the
                turn immediately with `input` as a user_message reason. A user
                token (`sks_`) creates a session OWNED by its bound
                end user; invocation-key sessions are ownerless (backend-only).
            security:
                - invocationKey: []
                - userToken: []
                - platformApiKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "sessions-api.yaml#/components/schemas/NewSessionRequest",
                            }
            responses:
                "201":
                    description: created; turn started
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "sessions-api.yaml#/components/schemas/SessionCreated",
                                }
                "400":
                    {
                        $ref: "sessions-api.yaml#/components/responses/InvalidInput",
                    }
                "404":
                    {
                        description: "unknown app, no active deployment, or a route the deployment doesn't serve",
                    }
                "429":
                    {
                        $ref: "sessions-api.yaml#/components/responses/TooManyRequests",
                    }
        get:
            operationId: listSessions
            summary: List sessions (sessions tables, approvals inbox source)
            security:
                - invocationKey: []
                - userToken: []
                - platformApiKey: []
            parameters:
                - { name: app_id, in: query, schema: { type: string } }
                - {
                      name: status,
                      in: query,
                      schema: { $ref: "sessions-api.yaml#/components/schemas/SessionStatus" },
                  }
                - {
                      name: external_user_id,
                      in: query,
                      description: "owner filter (backend/platform callers only; rejected for browser tokens, which are always scoped to their own user)",
                      schema: { type: string },
                  }
                - { name: limit, in: query, schema: { type: integer, default: 50 } }
                - {
                      name: created_before,
                      in: query,
                      description: RFC 3339; keyset pagination,
                      schema: { type: string },
                  }
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: "sessions-api.yaml#/components/schemas/Session" }
    /tokens:
        post:
            operationId: mintUserToken
            summary: Mint a user-scope browser token (sks_)
            description: >-
                Server-to-server. The app's backend, authenticated with
                its invocation key, asserts the end-user identity its own auth
                established; the returned opaque `sks_` token is safe to hand to
                that user's browser. It can create sessions owned by the user,
                list only their sessions, and get/stream/input/decide approvals
                on them. Rate-limited per (key, external_user_id): 429 when
                exhausted. TTL 24h by default (server-configurable).
            security:
                - invocationKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [app, external_user_id]
                            properties:
                                app: { type: string, description: the invocation key's own app (id or slug) }
                                external_user_id: { type: string, maxLength: 512, description: "opaque, app-defined end-user id" }
            responses:
                "201":
                    description: minted; the token is shown once
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [token]
                                properties:
                                    token: { type: string, description: "sks_…" }
                "400": { description: invalid request or app does not match the key }
                "401": { description: not an invocation key }
                "429": { description: mint rate limit exhausted }
    /sessions/{sessionId}:
        get:
            operationId: getSession
            summary: Session metadata (inspector meta bar, tables)
            security:
                - invocationKey: []
                - userToken: []
                - platformApiKey: []
            parameters:
                - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: "sessions-api.yaml#/components/schemas/Session" }
                "404": { description: unknown session }
    /sessions/{sessionId}/events:
        get:
            operationId: streamSessionEvents
            summary: Journal tail (SSE) — the ONLY live view; never proxied from a runner
            description: >-
                `text/event-stream`. Each frame's `data:` is one event envelope
                (event.schema.json); the SSE `id:` is the event's UUIDv7 `id`.
                Replays the full journal from seq 0, then holds the tail open.
                Resumption: standard `Last-Event-ID` header (or `last_event_id`
                query param for first-connect) → replay `WHERE seq > $1`. A
                browser's `EventSource` can't set headers: it passes a user
                token as `?token=` (this endpoint only).
            security:
                - invocationKey: []
                - userToken: []
                - platformApiKey: []
            parameters:
                - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
                - { name: last_event_id, in: query, schema: { type: string, format: uuid } }
            responses:
                "200":
                    description: SSE stream
                    content:
                        text/event-stream:
                            schema: { $ref: "./event.schema.json" }
    /sessions/{sessionId}/input:
        post:
            operationId: sendSessionInput
            summary: Send a user message (follow-up turn)
            description: >-
                Journaled as an INVOCATION_STARTED with reason user_message. 202
                means the turn is SCHEDULED — turns run asynchronously; follow the
                SSE journal tail for the output. An input after an ERRORED turn is
                accepted (a fresh turn is the recovery path).
            security:
                - invocationKey: []
                - userToken: []
                - platformApiKey: []
            parameters:
                - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "sessions-api.yaml#/components/schemas/SessionInput" }
            responses:
                "202": { description: turn scheduled }
                "400": { $ref: "sessions-api.yaml#/components/responses/InvalidInput" }
                "404": { description: unknown session }
                "409":
                    description: >-
                        session not accepting input — mid-turn (a live lease holds the
                        session), awaiting an approval decision (decide it first: a new
                        message would strand the unanswered tool call in the
                        conversation), or ended. NOT a 409 after an errored turn.
                "429": { $ref: "sessions-api.yaml#/components/responses/TooManyRequests" }
    /sessions/{sessionId}/approval:
        post:
            operationId: decideApproval
            summary: Decide a pending approval (banner, approvals inbox)
            description: >-
                Journaled as TOOL_APPROVAL_GRANTED/DENIED, then the platform resumes
                the turn with an approval_decision invocation.
            security:
                - invocationKey: []
                - userToken: []
                - platformApiKey: []
            parameters:
                - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "sessions-api.yaml#/components/schemas/ApprovalDecision" }
            responses:
                "202": { description: decision journaled; resume scheduled }
                "404": { description: unknown session }
                "409": { description: no pending approval on this session }
                "429": { $ref: "sessions-api.yaml#/components/responses/TooManyRequests" }
    /approvals:
        $ref: "sessions-api.yaml#/paths/~1approvals"

    # ----------------------------------------------------------------- AG-UI
    # Every deployed route is also an AG-UI 1.0 endpoint, another view over the
    # journal. NORMATIVE: agui-mapping.md
    # (event mapping, interrupts, connect states, errors); this entry is the
    # HTTP surface only. Event and request shapes are AG-UI's own (upstream
    # schema vendored at vendor/ag-ui/), so they are sketched here, not
    # redefined. The `sectr dev` gateway serves the same endpoint with no
    # auth and no 429s.
    /ag-ui/{app}/{route}:
        parameters:
            - {
                  name: app,
                  in: path,
                  required: true,
                  schema: { type: string },
                  description: the app's id or slug,
              }
            - name: route
              in: path
              required: true
              schema: { type: string }
              description: >-
                  the manifest route path without its leading slash (`/chat` →
                  `chat`). Nested routes keep their slashes
                  (`/ag-ui/my-app/support/chat`), which OpenAPI path templates
                  cannot express. Must be a route of the app's active
                  deployment.
        post:
            operationId: runAgUi
            summary: Run the agent (AG-UI 1.0) — one turn, streamed
            description: >-
                One AG-UI run is one Sectr turn: `threadId` is the session id (a
                UUID) and the stream is that turn's events projected to AG-UI,
                ending in exactly one `RUN_FINISHED` or `RUN_ERROR`. A new
                `threadId` creates the session, owned by a user token's end user;
                it must start empty (earlier history → 400). On an existing
                thread the client's `messages` are ignored except the trailing
                user message: `RUN_STARTED` is followed by a `MESSAGES_SNAPSHOT`
                of the journal. A tool needing approval ends the run with
                `RUN_FINISHED {outcome: {type: interrupt}}`; the client answers
                with a run carrying `resume: [{interruptId, status, payload}]`
                (`payload: true` approves, `false` or `status: cancelled`
                denies). An invalid resume is a 200 stream of `RUN_STARTED` +
                `RUN_ERROR` (`code: invalid_run`), not an HTTP error. CORS: any
                origin, `GET`/`POST`, headers `authorization, content-type,
                accept`; preflights are answered before auth. Platform keys are
                refused (403).
            security:
                - userToken: []
                - invocationKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RunAgentInput" }
            responses:
                "200":
                    description: >-
                        AG-UI event stream: one JSON event per `data:` frame,
                        keep-alive comments every 15 s, no `id:` field (runs are
                        not resumable; reconnect with GET instead).
                    content:
                        text/event-stream:
                            schema: { $ref: "#/components/schemas/AgUiEvent" }
                "400":
                    description: >-
                        malformed `RunAgentInput`; `protocolVersion` not 1.x;
                        `threadId` not a UUID; trailing message not `role: user`,
                        its `content` not a string (content parts), or only
                        whitespace; history on a new thread
                    content: &aguiError
                        application/json:
                            schema:
                                {
                                    $ref: "sessions-api.yaml#/components/schemas/ErrorWithCode",
                                }
                "401":
                    {
                        description: "missing, unknown, revoked or expired token",
                        content: *aguiError,
                    }
                "403":
                    {
                        description: "a platform key, or a token for another app",
                        content: *aguiError,
                    }
                "404":
                    description: >-
                        unknown app, route not in the active deployment (the
                        message names the available routes), or a thread that is
                        not the caller's (never 403: it reveals nothing about the
                        owner)
                    content: *aguiError
                "409":
                    description: >-
                        the thread is mid-turn (reattach with GET instead), is
                        awaiting an approval decision (answer it with `resume`),
                        or belongs to another route of the app
                    content: *aguiError
                "429":
                    description: >-
                        concurrency, capacity or rate limit: `code` is
                        `concurrency_limit`, `platform_capacity` or
                        `rate_limited`. Nothing was journaled; retry the same run
                        after `Retry-After`.
                    headers:
                        Retry-After:
                            description: seconds to wait before retrying
                            schema: { type: integer, minimum: 1 }
                    content: *aguiError
        get:
            operationId: connectAgUi
            summary: Reconnect to a thread — re-stream its latest run (read-only)
            description: >-
                The server half of an AG-UI client's `connect()` (outside
                AG-UI 1.0, which has no reconnect). Streams the thread's
                latest run as a run would: `RUN_STARTED` (the original `runId`),
                a `MESSAGES_SNAPSHOT` of the history before it, then the run's
                events: replayed, then live until its terminal event. So a
                reloaded page gets a finished turn, a turn still streaming, or
                the same pending interrupt back. A thread that doesn't exist yet,
                or has no run, is an empty 200. Writes nothing and starts
                nothing; never 429. Same credentials, CORS and ownership rules as
                POST.
            security:
                - userToken: []
                - invocationKey: []
            parameters:
                - {
                      name: threadId,
                      in: query,
                      required: true,
                      schema: { type: string, format: uuid },
                  }
            responses:
                "200":
                    description: >-
                        AG-UI event stream (as POST), or an empty body for a
                        thread with no run
                    content:
                        text/event-stream:
                            schema: { $ref: "#/components/schemas/AgUiEvent" }
                "400":
                    {
                        description: "`threadId` missing or not a UUID",
                        content: *aguiError,
                    }
                "401":
                    {
                        description: "missing, unknown, revoked or expired token",
                        content: *aguiError,
                    }
                "403":
                    {
                        description: "a platform key, or a token for another app",
                        content: *aguiError,
                    }
                "404":
                    {
                        description: "unknown app or route, or a thread that is not the caller's",
                        content: *aguiError,
                    }
                "409":
                    {
                        description: the thread belongs to another route of the app,
                        content: *aguiError,
                    }

    # ------------------------------------------------------------------ auth
    /auth/login:
        post:
            operationId: login
            summary: Dashboard login (email + password)
            # Scalar: hide dashboard-session endpoints from the rendered reference
            # (they stay in the served document; see docs reference/api-spec).
            x-scalar-ignore: true
            description: >-
                SUPERSEDED by the Clerk sign-in (`POST /auth/clerk`); never
                implemented by the server. Kept only as the historical cookie-flow
                sketch.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email: { type: string, format: email }
                                password: { type: string }
            responses:
                "204": { description: logged in; session cookie set }
                "401": { description: invalid credentials }
    /auth/clerk:
        post:
            operationId: exchangeClerkSession
            summary: >-
                Exchange a Clerk session JWT for a short-lived dashboard-session
                platform key
            x-scalar-ignore: true
            description: >-
                The dashboard's Clerk sign-in (GitHub / Google). The Clerk
                session JWT is verified networklessly (RS256 against the instance's
                public key; `iss`, `exp`/`nbf`, `azp`, `sub`, and the custom `email`
                claim). The account is resolved by the Clerk `sub` alone (no
                linking by email): a returning Clerk user gets their org, anyone
                else a brand-new org + user. Then an ordinary `platform` key with an `expires_at`
                (`SECTR_DASHBOARD_SESSION_TTL_SECS`, default 7 days, named
                `dashboard session (Clerk)`) is minted. The token goes in the BODY,
                never `Authorization`. The key is returned once and never logged.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [session_token]
                            properties:
                                session_token:
                                    {
                                        type: string,
                                        description: the Clerk session JWT (`getToken()`),
                                    }
            responses:
                "200":
                    description: signed in
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [key, org_slug, created, expires_at]
                                properties:
                                    key:
                                        {
                                            type: string,
                                            description: skp_… full value; shown once,
                                        }
                                    org_slug: { type: string }
                                    created:
                                        {
                                            type: boolean,
                                            description: this sign-in created the org,
                                        }
                                    expires_at: { type: string, format: date-time }
                "401":
                    description: >-
                        invalid Clerk session (any verification failure; no detail on
                        the wire)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties: { error: { type: string } }
                "403":
                    description: >-
                        `{"error": <message>, "code": "beta_full"}` — the signup cap is
                        reached and no org was created. Clients
                        branch on `code`; `error` is human-readable.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [error, code]
                                properties:
                                    error: { type: string }
                                    code: { type: string, enum: [beta_full] }
                "500":
                    description: >-
                        the Clerk session-token template lacks the `email` claim
                        (operator misconfiguration)
                "503":
                    description: Clerk is not configured, or a non-Postgres deployment
    /auth/cli:
        post:
            operationId: startCliLogin
            summary: Start a browser login for `sectr auth login` (device flow)
            x-scalar-ignore: true
            description: >-
                Anonymous. Creates a pending login request that expires in 10
                minutes. The CLI shows `verification_url_complete` and `user_code`
                to the user and polls `POST /auth/cli/poll` with the secret
                `device_code` every `interval` seconds. Rate limited (429 with
                `Retry-After`).
            security: []
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                client_name:
                                    {
                                        type: string,
                                        description: "the CLI's hostname; display only, trimmed to 64 characters",
                                    }
            responses:
                "200":
                    description: request created
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    [
                                        device_code,
                                        user_code,
                                        verification_url,
                                        verification_url_complete,
                                        expires_in,
                                        interval,
                                    ]
                                properties:
                                    device_code: { type: string, description: secret; only the CLI holds it }
                                    user_code: { type: string, example: WDJB-MJHT }
                                    verification_url: { type: string }
                                    verification_url_complete: { type: string }
                                    expires_in: { type: integer, example: 600 }
                                    interval: { type: integer, example: 2 }
                "429": { description: too many login attempts }
                "503": { description: non-Postgres deployment }
    /auth/cli/poll:
        post:
            operationId: pollCliLogin
            summary: Poll a browser login request
            x-scalar-ignore: true
            description: >-
                Anonymous. `approved` is returned exactly once: that call mints
                the non-expiring platform key (named `CLI (<client_name>)`) and
                returns it. Unknown, already-collected and expired device codes
                all answer `expired`.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [device_code]
                            properties: { device_code: { type: string } }
            responses:
                "200":
                    description: the request's state
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [status]
                                properties:
                                    status:
                                        {
                                            type: string,
                                            enum: [pending, approved, denied, expired],
                                        }
                                    key: { type: string, description: skp_… full value; only with approved }
                                    key_id: { type: string, format: uuid }
                                    org:
                                        type: object
                                        properties:
                                            id: { type: string, format: uuid }
                                            name: { type: string }
                "503": { description: non-Postgres deployment }
    /auth/cli/requests/{userCode}:
        get:
            operationId: getCliLoginRequest
            summary: Look up a browser login request (approval page)
            x-scalar-ignore: true
            description: Platform principal. The code is matched case- and dash-insensitively.
            parameters:
                - { name: userCode, in: path, required: true, schema: { type: string } }
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [user_code, client_name, created_at, expires_at, status]
                                properties:
                                    user_code: { type: string }
                                    client_name: { type: string }
                                    created_at: { type: string, format: date-time }
                                    expires_at: { type: string, format: date-time }
                                    status:
                                        {
                                            type: string,
                                            enum: [pending, approved, denied, consumed],
                                        }
                "404": { description: unknown or expired }
    /auth/cli/requests/{userCode}/approve:
        post:
            operationId: approveCliLogin
            summary: Approve a browser login request
            x-scalar-ignore: true
            description: >-
                Platform principal. Records the approving org; the key is minted
                when the CLI next polls, in that org.
            parameters:
                - { name: userCode, in: path, required: true, schema: { type: string } }
            responses:
                "204": { description: approved }
                "404": { description: unknown or expired }
                "409": { description: not pending (body carries the current `status`) }
    /auth/cli/requests/{userCode}/deny:
        post:
            operationId: denyCliLogin
            summary: Deny a browser login request
            x-scalar-ignore: true
            description: Platform principal.
            parameters:
                - { name: userCode, in: path, required: true, schema: { type: string } }
            responses:
                "204": { description: denied }
                "404": { description: unknown or expired }
                "409": { description: not pending (body carries the current `status`) }
    /auth/logout:
        post:
            operationId: logout
            summary: Sign out — revoke the presented dashboard-session key
            x-scalar-ignore: true
            description: >-
                Platform principal. Revokes the PRESENTED key only if it
                has an `expires_at` (a dashboard-session key); a pasted long-lived
                key is never revoked by signing out. Any live platform key gets a
                204, whether or not it was revoked. A repeat call with a key that
                is already revoked is a 401, as on every authenticated route.
            responses:
                "204": { description: signed out }
                "401": { description: "missing, unknown, revoked or expired key" }

    /me:
        get:
            operationId: getMe
            summary: Current user + organization (sidebar, account menus)
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/Me" }

    # ------------------------------------------------------------------ apps
    /apps:
        get:
            operationId: listApps
            summary: List apps (console overview, sidebar, command palette)
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    { $ref: "#/components/schemas/AppSummary" }
    /apps/{appId}:
        get:
            operationId: getApp
            summary: App detail (overview tab — agents, deployments, URL)
            parameters:
                - {
                      name: appId,
                      in: path,
                      required: true,
                      schema: { type: string },
                  }
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AppDetail" }
                "404": { description: unknown app }
    /apps/{appId}/deployments:
        get:
            operationId: listAppDeployments
            summary: Deployment history (overview tab table)
            parameters:
                - {
                      name: appId,
                      in: path,
                      required: true,
                      schema: { type: string },
                  }
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    { $ref: "#/components/schemas/Deployment" }

    # ----------------------------------------------------------- deployments
    /deployments:
        post:
            operationId: createDeployment
            summary: "Ship a new deployment (CLI: `sectr deploy`)"
            description: >-
                Multipart upload of the packaged agent + manifest. First deploy for
                an unknown app name creates the app (CLI-first creation). Auth:
                platform API key.
            security:
                - platformApiKey: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [tarball, manifest]
                            properties:
                                tarball: { type: string, format: binary }
                                manifest: { type: string } # sectr.toml contents
            responses:
                "202":
                    description: >-
                        Accepted — the build runs off-request. The response body is the
                        deployment row in `building` state; poll
                        `GET /apps/{appId}/deployments` until `status` reaches `active`
                        or `failed` (a `failed` row carries its `error`).
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/Deployment" }
                "400":
                    description: >-
                        Validation failure: unreadable multipart (the `tarball` or
                        `manifest` field could not be read), or the body is missing a
                        required field.
                "422":
                    description: >-
                        Validation/rejection failure: invalid `sectr.toml` (not TOML,
                        missing or empty `agent.entry`), the app has a secret named
                        `SECTR_APPROVAL_POLICY` (Sectr sets that variable from
                        `[deploy] approval_tools`; remove the secret), or the deploy
                        was rejected server-side (registry/artifact-store error — a
                        version collision under concurrent deploys of the same app
                        surfaces here).
    /deployments/{deploymentId}/activate:
        post:
            operationId: activateDeployment
            summary: Make a deployment current (dashboard rollback / promote)
            description: >-
                New sessions pin to the newly-active deployment; existing sessions
                keep their pinned deployment.
            parameters:
                - {
                      name: deploymentId,
                      in: path,
                      required: true,
                      schema: { type: string },
                  }
            responses:
                "202": { description: activation accepted }
                "404": { description: unknown deployment }
                "409":
                    description: >-
                        Deployment not in a ready state — only `active` or `retired`
                        rows (a resolved build) can be activated; `building` and
                        `failed` targets are rejected.

    # --------------------------------------------------------------- secrets
    /secrets:
        get:
            operationId: listSecrets
            summary: List secret NAMES only (settings; write-only by design)
            parameters:
                - {
                      name: app,
                      in: query,
                      required: true,
                      schema: { type: string },
                      description: the app's slug (secrets are scoped per app),
                  }
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    { $ref: "#/components/schemas/SecretMeta" }
    /secrets/{key}:
        put:
            operationId: putSecret
            summary: Create or replace a secret (value never readable back)
            parameters:
                - {
                      name: key,
                      in: path,
                      required: true,
                      schema: { type: string },
                      description: "env-safe name, [A-Za-z_][A-Za-z0-9_]*",
                  }
                - {
                      name: app,
                      in: query,
                      required: true,
                      schema: { type: string },
                      description: the app's slug (secrets are scoped per app),
                  }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [value]
                            properties:
                                value: { type: string }
            responses:
                "204": { description: stored }
                "422":
                    description: >-
                        The key isn't env-safe, or is `SECTR_APPROVAL_POLICY`: Sectr
                        sets that variable on every runner from `[deploy]
                        approval_tools` in sectr.toml, so it can't be a secret.
                        Body: `{error}`.
        delete:
            operationId: deleteSecret
            summary: Delete a secret
            parameters:
                - {
                      name: key,
                      in: path,
                      required: true,
                      schema: { type: string },
                  }
                - {
                      name: app,
                      in: query,
                      required: true,
                      schema: { type: string },
                      description: the app's slug (secrets are scoped per app),
                  }
            responses:
                "204": { description: deleted }

    # -------------------------------------------------------------- api keys
    /api-keys:
        get:
            operationId: listApiKeys
            summary: List API keys (settings; metadata only)
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    { $ref: "#/components/schemas/ApiKeyMeta" }
        post:
            operationId: createApiKey
            summary: Create an API key — full value returned exactly once
            description: >-
                Mints either key class. Platform keys are org-scoped; invocation
                keys must carry the `app_id` they scope to (the DDL CHECK enforces
                the class/app_id consistency too). The full value is returned once
                and never stored — only its SHA-256 hash.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, kind]
                            properties:
                                name: { type: string }
                                kind:
                                    { $ref: "#/components/schemas/ApiKeyKind" }
                                app_id:
                                    {
                                        type: string,
                                        format: uuid,
                                        description: invocation keys only,
                                    }
            responses:
                "201":
                    description: created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiKeyMeta"
                                    - type: object
                                      required: [key]
                                      properties:
                                          key:
                                              {
                                                  type: string,
                                                  description: full secret value; shown once,
                                              }
                "400": { description: class/app_id mismatch or unknown app }
    /api-keys/{keyId}:
        delete:
            operationId: revokeApiKey
            summary: Revoke an API key
            parameters:
                - {
                      name: keyId,
                      in: path,
                      required: true,
                      schema: { type: string, format: uuid },
                  }
            responses:
                "204": { description: revoked }

components:
    securitySchemes:
        platformApiKey:
            type: http
            scheme: bearer
        invocationKey:
            type: http
            scheme: bearer
            description: >-
                per-app invocation key minted in the dashboard settings — the
                trusted-backend / minting credential; never ship it to a
                browser in a multi-user app
        userToken:
            type: http
            scheme: bearer
            description: >-
                short-TTL end-user browser token (`sks_`) minted via POST /tokens.
                Also accepted as `?token=` on the SSE endpoint only (EventSource
                cannot set headers) — access logs must redact it.

    schemas:
        # AG-UI 1.0 shapes are upstream's (vendor/ag-ui/schema.json); these
        # sketch what Sectr reads and emits. agui-mapping.md is normative.
        RunAgentInput:
            type: object
            description: >-
                AG-UI 1.0 `RunAgentInput`
                (https://docs.ag-ui.com/sdk/js/core/types#runagentinput). Sectr
                reads the fields below; `state` and `parentRunId` are accepted
                and ignored, and `tools` is accepted but unused (frontend tools
                are not supported yet).
            required: [threadId, runId, messages]
            properties:
                threadId:
                    {
                        type: string,
                        format: uuid,
                        description: the Sectr session id; a new one creates the session,
                    }
                runId:
                    {
                        type: string,
                        description: "the client's run id: echoed in RUN_STARTED and journaled (the invocation id stays server-minted)",
                    }
                protocolVersion:
                    {
                        type: string,
                        description: "optional; must be 1.x (minor versions are additive)",
                    }
                messages:
                    type: array
                    description: >-
                        AG-UI messages. The trailing one must be `role: user`
                        (its `content`, which must be a string, becomes the turn's
                        input; content parts are a 400), except on a
                        resume run. On a new thread nothing but `system` /
                        `developer` messages may precede it; on an existing
                        thread earlier messages are ignored (the journal is the
                        history).
                    items: { type: object }
                resume:
                    type: array
                    maxItems: 1
                    description: >-
                        the answer to the pending approval interrupt, which
                        makes this a resume run
                    items:
                        type: object
                        required: [interruptId, status]
                        properties:
                            interruptId: { type: string }
                            status: { type: string, enum: [resolved, cancelled] }
                            payload:
                                {
                                    type: boolean,
                                    description: "with `resolved`: true approves, false denies",
                                }
                forwardedProps:
                    {
                        type: object,
                        description: journaled with the run; not yet exposed to agent code,
                    }
                context:
                    {
                        type: array,
                        items: { type: object },
                        description: journaled with the run; not yet exposed to agent code,
                    }
                tools: { type: array, items: { type: object } }
                state: {}
                parentRunId: { type: string }
        AgUiEvent:
            type: object
            description: >-
                One AG-UI 1.0 event (https://docs.ag-ui.com/concepts/events).
                Every event carries `timestamp` (ms) and `metadata: {seq}` (the
                journal sequence number). Not emitted: `STATE_*`, `*_CHUNK`,
                `ACTIVITY_*`, `RUN_FINISHED.usage`.
            required: [type]
            properties:
                type:
                    type: string
                    enum:
                        [
                            RUN_STARTED,
                            MESSAGES_SNAPSHOT,
                            TEXT_MESSAGE_START,
                            TEXT_MESSAGE_CONTENT,
                            TEXT_MESSAGE_END,
                            REASONING_START,
                            REASONING_MESSAGE_START,
                            REASONING_MESSAGE_CONTENT,
                            REASONING_MESSAGE_END,
                            REASONING_END,
                            TOOL_CALL_START,
                            TOOL_CALL_ARGS,
                            TOOL_CALL_END,
                            TOOL_CALL_RESULT,
                            RUN_FINISHED,
                            RUN_ERROR,
                        ]
                timestamp: { type: integer }
                metadata:
                    type: object
                    properties:
                        seq: { type: integer }
            additionalProperties: true

        ApiKeyKind:
            type: string
            enum: [platform, invocation, user]

        Me:
            type: object
            description: >-
                MVP: no user records exist (paste-a-platform-key login, decided
                2026-09-12), so `user` is absent; `org` is the authenticated
                principal's org.
            required: [org, dashboard_url]
            properties:
                user:
                    type: object
                    required: [id, email, name]
                    properties:
                        id: { type: string, format: uuid }
                        email: { type: string, format: email }
                        name: { type: string }
                org:
                    type: object
                    required: [id, name]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                dashboard_url:
                    type: string
                    format: uri
                    description: >-
                        The origin of this server's dashboard, with no trailing
                        slash. Clients build links to it from this.

        AppSummary:
            type: object
            required:
                [
                    id,
                    name,
                    framework,
                    description,
                    url,
                    routes,
                    sessions_count,
                    latest_deployment,
                ]
            properties:
                id: { type: string }
                name: { type: string }
                # nullable: an app's framework marker comes from its deployment
                # manifest and may be absent (raw SDK apps); url is null until
                # per-app public hostnames exist (post-MVP).
                framework:
                    {
                        type: [string, "null"],
                        enum: [openai-agents, langgraph, pydantic-ai, claude-code, null],
                    }
                description: { type: string }
                url:
                    {
                        type: [string, "null"],
                        description: "public app host (null in the MVP)",
                    }
                routes:
                    type: array
                    items:
                        type: object
                        required: [path, description]
                        properties:
                            path: { type: string }
                            description: { type: string }
                sessions_count: { type: integer }
                latest_deployment: { $ref: "#/components/schemas/Deployment" }

        AppDetail:
            allOf:
                - $ref: "#/components/schemas/AppSummary"
                - type: object
                  properties:
                      deployments:
                          type: array
                          items: { $ref: "#/components/schemas/Deployment" }

        DeploymentStatus:
            # Registry enum (source of truth): building -> active | failed;
            # active -> retired (superseded or via the activate endpoint).
            type: string
            enum: [building, active, failed, retired]
        Deployment:
            type: object
            required: [id, app_id, version, status, created_at, active]
            properties:
                id: { type: string }
                app_id: { type: string }
                version: { type: integer }
                status: { $ref: "#/components/schemas/DeploymentStatus" }
                created_at: { type: string, format: date-time }
                commit_message: { type: string }
                # Optional (absent unless the build failed): truncated tail of the
                # build/failure output, or the stale-sweep message for rows orphaned
                # by a server restart. Cleared (absent) on successful builds.
                error: { type: string }
                active:
                    {
                        type: boolean,
                        description: current deployment for new sessions,
                    }

        SecretMeta:
            type: object
            required: [name, created_at]
            properties:
                name: { type: string }
                created_at: { type: string, format: date-time }
                updated_at:
                    {
                        type: string,
                        format: date-time,
                        nullable: true,
                        description: when the value was last replaced; null if never,
                    }

        ApiKeyMeta:
            type: object
            description: >-
                Metadata only — the store keeps SHA-256 hashes, so no display
                prefix exists; `name` identifies keys. `revoked_at` non-null keys
                authenticate as nonexistent.
            required: [id, name, kind, created_at]
            properties:
                id: { type: string, format: uuid }
                name: { type: string }
                kind: { $ref: "#/components/schemas/ApiKeyKind" }
                app_id:
                    {
                        type: string,
                        format: uuid,
                        nullable: true,
                        description: invocation keys only,
                    }
                created_at: { type: string, format: date-time }
                last_used_at:
                    { type: string, format: date-time, nullable: true }
                revoked_at: { type: string, format: date-time, nullable: true }
                expires_at:
                    {
                        type: string,
                        format: date-time,
                        nullable: true,
                        description: "hard expiry (dashboard-session keys, minted by POST /auth/clerk); expired keys authenticate as nonexistent. Null = never expires.",
                    }
