[project]
name = "sectr-schema-conformance"
version = "0.1.0"
description = "Sectr contract conformance suite (validates schema fixtures + cross-artifact consistency)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "rfc3339-validator>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["."]
