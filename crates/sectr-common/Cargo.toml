[package]
name = "sectr-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
tower-http.workspace = true
futures.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
sha2.workspace = true
crypto_box.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
anyhow.workspace = true
# Telemetry bootstrap (shared: sectr-server + sectr-worker both
# call sectr_common::telemetry::init). Deps live here, not per-binary.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-appender-tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
bollard = { version = "0.19", default-features = false, features = ["chrono", "pipe"] }
# GCS-backed ArtifactStore. Off by default so the
# standard workspace build gains no GCP dependency weight; enable with
# `--features gcs` (google-cloud-storage = the official googleapis
# google-cloud-rust client, 1.x stable).
google-cloud-storage = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
gcs = ["dep:google-cloud-storage", "dep:google-cloud-auth", "dep:bytes"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Bucket setup for the fake-gcs-server tests (JSON API; the StorageControl
# client defaults to gRPC, which the emulator doesn't speak).
reqwest.workspace = true
pgtemp = "0.7.1"
libc = "0.2"
