[package]
name = "sectr-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sectr-common.workspace = true
axum = { workspace = true, features = ["macros", "ws", "multipart"] }
tokio.workspace = true
futures.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Metrics: the OTel instruments themselves (opentelemetry is the
# API crate; the pipeline/provider lives in sectr-common::telemetry).
opentelemetry.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
getrandom.workspace = true
async-trait.workspace = true
thiserror.workspace = true
clap.workspace = true
sqlx.workspace = true

tar = { workspace = true }
flate2 = { workspace = true }
toml = { workspace = true }

# GcpPlatform — optional, behind the `gcp` feature.
google-cloud-build-v1 = { workspace = true, optional = true }
google-cloud-run-v2 = { workspace = true, optional = true }
google-cloud-wkt = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
google-cloud-lro = { workspace = true, optional = true }
# Signed URLs for the hosted builds' files (the server signs; the builds
# hold no bucket access).
google-cloud-storage = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }

# E2bPlatform — REST client only (no Rust SDK exists); the
# build half is still Cloud Build, so `e2b` implies `gcp`. NOTE: that pulls
# the google-cloud-run-v2 crates even though the E2B platform never ensures
# jobs — structural, do not split a build/gcs feature for it.
# PostHog capture client (analytics.rs) + E2bPlatform's REST client
# — one reqwest, always on. NOTE: it used to be optional
# (behind `e2b`); analytics must exist in every build, so it is a plain
# dependency now (same crate the e2b feature used — no new dep tree).
reqwest = { workspace = true }

[features]
# GCS artifact store — passthrough to sectr-common.
gcs = ["sectr-common/gcs"]
# GcpPlatform — Cloud Build + Cloud Run Jobs clients,
# plus the GCS artifact store (the gcs↔gcp pairing is structural: a Cloud
# Build builder reads `gs:` artifact URIs). Build creation uses the v1
# client: google-cloud-build-v2 1.13 has no Build model (see root
# Cargo.toml).
gcp = [
    "gcs",
    "dep:google-cloud-build-v1",
    "dep:google-cloud-run-v2",
    "dep:google-cloud-wkt",
    "dep:google-cloud-gax",
    "dep:google-cloud-lro",
    "dep:google-cloud-storage",
    "dep:google-cloud-auth",
]
# E2B runner backend: Cloud Build build half (via `gcp`) +
# the E2B REST client. Implies gcp (which implies gcs) — the E2B backend
# builds on Cloud Build + Artifact Registry exactly like the gcp platform;
# only spawn/teardown differ (sandboxes instead of job executions).
e2b = ["gcp"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest.workspace = true
# span_middleware tests capture JSON logs; the lib itself gets the
# subscriber from sectr-common::telemetry.
tracing-subscriber.workspace = true
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures-util = "0.3"
sectr-worker.workspace = true
pgtemp = "0.7.1"
# Clerk JWT tests generate their RSA keys at runtime (testkeys.rs); same crate
# jsonwebtoken already uses.
aws-lc-rs = "1"
libc = "0.2.189"
